    properties:
      cadence:
        enum:
        - monthly
        - quarterly
        - half-yearly
        - yearly
        type: string
      distributionListEmail:
        type: string
      name:
        type: string
      teamLeadId:
        type: string
    type: object
  github_com_agopalakrishnan_teams360_backend_interfaces_dto.UpdateUserRequest:
    properties:
      authType:
        enum:
        - local
        - sso
        type: string
      email:
        type: string
      fullName:
        type: string
      hierarchyLevel:
        type: string
      password:
        type: string
      reportsTo:
        type: string
      username:
        type: string
    type: object
  github_com_agopalakrishnan_teams360_backend_interfaces_dto.UserDTO:
    properties:
      canTakeSurvey:
        type: boolean
      email:
        type: string
      fullName:
        type: string
      hierarchyLevel:
        type: string
      id:
        type: string
      teamIds:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  github_com_agopalakrishnan_teams360_backend_interfaces_dto.UsersResponse:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.AdminUserDTO'
        type: array
    type: object
  interfaces_api_v1.ssoCallbackRequest:
    properties:
      code:
        type: string
      code_verifier:
        type: string
    required:
    - code
    - code_verifier
    type: object
info:
  contact: {}
  description: Team360 Health Check Application REST API. Assesses team health across
    11 dimensions with hierarchical org support.
  title: Team360 API
  version: "1.0"
paths:
  /admin/hierarchy-levels:
    get:
      description: Returns all organizational hierarchy levels (e.g. VP, Director,
        Manager). Requires admin (level-1) role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.HierarchyLevelsResponse'
        "500":
          description: Failed to query hierarchy levels
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List hierarchy levels
      tags:
      - admin-hierarchy
    post:
      consumes:
      - application/json
      description: Creates a new organizational hierarchy level, appended at the end
        of the position order. Requires admin (level-1) role.
      parameters:
      - description: Hierarchy level
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.CreateHierarchyLevelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.HierarchyLevelDTO'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to determine position or create hierarchy level
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a hierarchy level
      tags:
      - admin-hierarchy
  /admin/hierarchy-levels/{id}:
    delete:
      description: Deletes a hierarchy level. Fails if any users are still assigned
        to it. Requires admin (level-1) role.
      parameters:
      - description: Hierarchy level ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.MessageResponse'
        "409":
          description: Users are assigned to this level
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Database error or failed to delete hierarchy level
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a hierarchy level
      tags:
      - admin-hierarchy
    put:
      consumes:
      - application/json
      description: Updates a hierarchy level's name and/or permissions. Requires admin
        (level-1) role.
      parameters:
      - description: Hierarchy level ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.UpdateHierarchyLevelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.HierarchyLevelDTO'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "404":
          description: Hierarchy level not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to update hierarchy level
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a hierarchy level
      tags:
      - admin-hierarchy
  /admin/hierarchy-levels/{id}/position:
    put:
      consumes:
      - application/json
      description: Moves a hierarchy level to a new position, shifting the other levels
        accordingly. Requires admin (level-1) role.
      parameters:
      - description: Hierarchy level ID
        in: path
        name: id
        required: true
        type: string
      - description: New position
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.UpdateHierarchyPositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "404":
          description: Hierarchy level not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to start transaction, reorder levels, update position,
            or commit
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reorder a hierarchy level
      tags:
      - admin-hierarchy
  /admin/settings/branding:
    get:
      description: Returns the company name and logo URL used for branding. Requires
        admin (level-1) role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.BrandingSettings'
        "500":
          description: Failed to fetch branding settings
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get branding settings
      tags:
      - admin-settings
    put:
      consumes:
      - application/json
      description: Updates the company name and/or logo URL (base64 data URL capped
        at ~500KB). Requires admin (level-1) role.
      parameters:
      - description: Branding settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.BrandingSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.BrandingSettings'
        "400":
          description: Invalid request body or logo too large
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to save branding settings
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update branding settings
      tags:
      - admin-settings
  /admin/settings/dimensions:
    get:
      description: Returns all health dimensions, including inactive ones. Requires
        admin (level-1) role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.DimensionsResponse'
        "500":
          description: Failed to query dimensions
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List health dimensions (admin)
      tags:
      - admin-settings
    post:
      consumes:
      - application/json
      description: Creates a new health dimension. Weight must be between 0 and 10
        (defaults to 1.0); isActive defaults to true. Requires admin (level-1) role.
      parameters:
      - description: Dimension to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.CreateDimensionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.HealthDimensionDTO'
        "400":
          description: Invalid request body or weight out of range
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to create dimension
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a health dimension
      tags:
      - admin-settings
  /admin/settings/dimensions/{id}:
    delete:
      description: Deletes a health dimension. Requires admin (level-1) role.
      parameters:
      - description: Dimension ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to delete dimension
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a health dimension
      tags:
      - admin-settings
    put:
      consumes:
      - application/json
      description: Updates a health dimension's fields. Weight must be between 0 and
        10. Requires admin (level-1) role.
      parameters:
      - description: Dimension ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.UpdateDimensionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.HealthDimensionDTO'
        "400":
          description: Invalid request body or weight out of range
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "404":
          description: Dimension not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to update dimension
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a health dimension
      tags:
      - admin-settings
  /admin/settings/notifications:
    get:
      description: Returns notification configuration (email/Slack enabled, submission
        reminders, SMTP status). Requires admin (level-1) role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.NotificationSettings'
        "500":
          description: Failed to fetch settings
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get notification settings
      tags:
      - admin-settings
    put:
      consumes:
      - application/json
      description: Updates notification configuration (email/Slack enabled, weekly
        digest). Requires admin (level-1) role.
      parameters:
      - description: Notification settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.NotificationSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.NotificationSettings'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to save settings
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update notification settings
      tags:
      - admin-settings
  /admin/settings/retention:
    get:
      description: Returns the data retention policy (months to keep sessions, anonymization
        window). Requires admin (level-1) role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.RetentionPolicy'
        "500":
          description: Failed to fetch retention policy
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get data retention policy
      tags:
      - admin-settings
    put:
      consumes:
      - application/json
      description: Updates the data retention policy. keepSessionsMonths must be between
        1 and 120. Requires admin (level-1) role.
      parameters:
      - description: Retention policy
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.RetentionPolicy'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.RetentionPolicy'
        "400":
          description: Invalid request body or keepSessionsMonths out of range
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to save retention policy
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update data retention policy
      tags:
      - admin-settings
  /admin/teams:
    get:
      description: Returns all teams with full admin details (team lead, cadence,
        distribution list, member count). Requires admin (level-1) role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.TeamsResponse'
        "500":
          description: Failed to query teams
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all teams (admin)
      tags:
      - admin-teams
    post:
      consumes:
      - application/json
      description: Creates a new team. If a team lead is set, the supervisor chain
        is auto-derived from their reports-to hierarchy. Requires admin (level-1)
        role.
      parameters:
      - description: Team to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.CreateTeamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.AdminTeamDTO'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to create team
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a team
      tags:
      - admin-teams
  /admin/teams/{id}:
    delete:
      description: Deletes a team. Requires admin (level-1) role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.MessageResponse'
        "500":
          description: Failed to delete team
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a team
      tags:
      - admin-teams
    put:
      consumes:
      - application/json
      description: Updates a team's name, lead, cadence, and/or distribution list
        email. Re-derives (or clears) the supervisor chain if the team lead changes.
        Requires admin (level-1) role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.UpdateTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.AdminTeamDTO'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "404":
          description: Team not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to update team
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a team
      tags:
      - admin-teams
  /admin/teams/{id}/members:
    get:
      description: Returns the members of a team. Requires admin (level-1) role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.TeamMembersResponse'
        "404":
          description: Team not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to fetch team members
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a team's members (admin)
      tags:
      - admin-teams
    post:
      consumes:
      - application/json
      description: Adds a user as a member of a team. Requires admin (level-1) role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: User to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.AddTeamMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "404":
          description: Team not found or user not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to add team member
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a member to a team
      tags:
      - admin-teams
  /admin/teams/{id}/members/{userId}:
    delete:
      description: Removes a user from a team's membership. Requires admin (level-1)
        role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.MessageResponse'
        "404":
          description: Team member not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to remove team member
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a member from a team
      tags:
      - admin-teams
  /admin/teams/{id}/supervisors:
    get:
      description: Returns the team's supervisor chain (derived from the team lead's
        reports-to hierarchy), enriched with user and level names. Requires admin
        (level-1) role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.SupervisorChainResponse'
        "404":
          description: Team not found
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to fetch supervisor chain
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a team's supervisor chain
      tags:
      - admin-teams
    put:
      consumes:
      - application/json
      description: Overwrites the team's supervisor chain with the given list. Requires
        admin (level-1) role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: New supervisor chain
        in: body
        name: body
        required: true
        schema:
