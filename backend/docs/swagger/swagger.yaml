      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Missing or invalid email
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request a password reset email
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a local user via username/password and issues a JWT
        access/refresh token pair. Public endpoint — SSO users cannot log in here.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.LoginRequest'
