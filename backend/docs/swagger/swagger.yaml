        (works with or without a valid session).
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access token. Public
        endpoint.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.RefreshTokenResponse'
        "400":
          description: Missing refresh token
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "401":
          description: Invalid or expired refresh token, or user no longer exists
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      summary: Refresh an access token
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
