          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "401":
          description: Invalid or expired reset token
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
        "500":
          description: Failed to reset password
          schema:
            $ref: '#/definitions/github_com_agopalakrishnan_teams360_backend_interfaces_dto.ErrorResponse'
      summary: Reset password using a reset token
      tags:
      - auth
  /auth/sso/callback:
    post:
      consumes:
      - application/json
      description: Exchanges an authorization code + PKCE verifier for the OAuth provider's
        tokens, resolves the user by email, and issues our own JWT access/refresh
        token pair. Public endpoint.
      parameters:
      - description: Authorization code and PKCE verifier
